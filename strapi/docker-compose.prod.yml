services:
  strapi:
    container_name: sabbe-satta-strapi
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: sabbe-satta-strapi:latest
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    networks:
      - strapi
    depends_on:
      strapiDB:
        condition: service_healthy

  strapiDB:
    container_name: sabbe-satta-postgres
    restart: always
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/
    networks:
      - strapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: sabbe-satta-nginx
    restart: always
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - strapi
    depends_on:
      - strapi

  certbot:
    container_name: sabbe-satta-certbot
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  strapi-data:
  strapi-uploads:

networks:
  strapi:
    name: strapi
    driver: bridge
