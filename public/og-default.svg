<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf9f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d35400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle pattern -->
  <circle cx="1100" cy="80" r="200" fill="#d35400" opacity="0.03"/>
  <circle cx="100" cy="550" r="150" fill="#d35400" opacity="0.03"/>
  
  <!-- Top accent line -->
  <rect x="80" y="120" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Title -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#1a1a1a" letter-spacing="-1">Sabbe Satta</text>
  
  <!-- Tagline -->
  <text x="80" y="280" font-family="system-ui, sans-serif" font-size="28" fill="#666" font-weight="300">Where ancient wisdom meets modern psychology.</text>
  
  <!-- Description -->
  <text x="80" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#999">Reflections on Buddhist psychology, mindfulness,</text>
  <text x="80" y="390" font-family="system-ui, sans-serif" font-size="20" fill="#999">and the examined life.</text>
  
  <!-- Bottom accent -->
  <rect x="80" y="540" width="1040" height="1" fill="#e5e2dc"/>
  
  <!-- URL -->
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="16" fill="#bbb">sabbesatta.com</text>
  
  <!-- Lotus symbol -->
  <text x="1080" y="580" font-family="Georgia, serif" font-size="40" fill="#d35400" opacity="0.15">❖</text>
</svg>
